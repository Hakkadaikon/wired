\* Mutation: a FIN on a held SUBSCRIBE ends it without an answer (the
\* moqtrun_req_settle "kind && !live" hazard). EXPECTED: NoSilentDrop fails.
CONSTANTS
    Subs = {s1, s2}
    Pubs = {p1, p2}
    MaxRT = 2
    RelayMax = 2
    SubWindow = 2
    Cap = 2
    BugFinDrops = TRUE
SPECIFICATION Spec
INVARIANTS
    AtMostOneAnswer
    NoSilentDrop
