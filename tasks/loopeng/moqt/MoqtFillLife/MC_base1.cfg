\* Base 1: one subscription, every sub filter x explicit fill filter, pause/resume, cancel, upstream loss.
SPECIFICATION Spec
CONSTANTS
  Subs = {s1}
  LG = 2
  SubFilters <- MCSubFilters
  FillFilters <- MCFillFilters
  MaxUpd = 1
  Slots = 2
  Waits = 1
INVARIANTS TypeOK FillRangeSpec PausedNoFill NoSilentDrop CancelResets MalformedCloses DoneCountExact
PROPERTIES FillsEnd DoneEventually
CHECK_DEADLOCK FALSE
