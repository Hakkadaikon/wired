\* Mutation: raw close fires on_session_close but keeps wt_active; free_slot fires it again (expect CloseOnce).
SPECIFICATION Spec
CONSTANTS
  Conns = {c1}
  Offers <- MCOffers
  RawList = {"moqt-18", "moqt-19", "moqt-22"}
  SetupOpts = {"NONE", "BADPATH"}
  MaxData = 1
  None = None
  MutLateSession = FALSE
  MutWtPath = FALSE
  MutH3Gate = FALSE
  MutKeepActive = TRUE
  CloseTearsDown = TRUE
  ViolationsOn = TRUE
INVARIANTS TypeOK SessBeforeData CloseOnce CloseIffSession NoGhost NoH3OnRaw RawCloseShape PathRule NoDataAfterClose SingleCloseFrame SessOnlyOnApp
CHECK_DEADLOCK FALSE
