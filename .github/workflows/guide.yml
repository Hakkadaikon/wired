name: Guide

# The usage guide under guide/ (published at /wired/guide/ by docs.yml).
# site: lint, type-check, unit tests, build, post-build tests.
# snippets: build every guide/snippets/<id>/main.c against the SDK, run it
# against the Go client, and compare the real output with golden.txt -- so
# an SDK change that alters what a page shows fails here, not on the page.
on:
  push:
    paths: ['guide/**', 'src/**', 'scripts/gen_ninja.sh', 'justfile', '.github/workflows/guide.yml']
  pull_request:
    paths: ['guide/**', 'src/**', 'scripts/gen_ninja.sh', 'justfile', '.github/workflows/guide.yml']
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guide
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: guide/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: guide/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:dist

  # Also on arm64: the only real-UDP check of WebTransport and MoQT there.
  snippets:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: build the SDK and the snippets
        run: nix develop -c just ninja guide

      # Outside nix: the runner only needs go and node on PATH.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: guide/go.mod
          cache-dependency-path: guide/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: run snippets and compare with golden.txt
        working-directory: guide
        run: node runner/run.ts
