name: Docs

# One GitHub Pages site for the whole repo: the Doxygen API reference at
# the root, the usage guide (guide/, Astro) under /guide/, and moqt_chat's
# static frontend demo under /moqt_chat/ (the
# repo is served at https://<user>.github.io/wired/, so that subpath is
# .../wired/moqt_chat/ -- next.config.ts's NEXT_PUBLIC_BASE_PATH below must
# match). All three are built into one merged directory before the single
# upload-pages-artifact step, since a Pages site can only publish one
# artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pinned toolchain as CI and local dev (flake.nix/flake.lock).
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Generate API reference
        run: nix develop -c just docs

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: examples/moqt_chat/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: examples/moqt_chat/frontend/pnpm-lock.yaml

      - name: Build moqt_chat frontend (static export)
        working-directory: examples/moqt_chat/frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /wired/moqt_chat
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # guide/'s astro.config.mjs base ('/wired/guide') must match the
      # pages-site/guide/ path below. pnpm itself is already set up above
      # (both packages pin the same pnpm version).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: guide/pnpm-lock.yaml

      - name: Build the guide
        working-directory: guide
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Merge into one Pages site
        run: |
          mkdir -p pages-site
          cp -r docs/sdk/. pages-site/
          mkdir -p pages-site/moqt_chat
          cp -r examples/moqt_chat/frontend/out/. pages-site/moqt_chat/
          mkdir -p pages-site/guide
          cp -r guide/dist/. pages-site/guide/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
