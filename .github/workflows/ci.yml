name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The flake (flake.nix + flake.lock) is the single source of truth for
      # the toolchain: CI runs the exact same clang/clang-tidy/clang-format/
      # lizard versions as `nix develop` locally, so a green gate here means
      # the same commands are green on a developer machine and vice versa.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: fmt-check
        run: nix develop -c just fmt-check

      - name: compile (freestanding, proves libc independence)
        run: nix develop -c just ninja

      - name: wire-check (every src .c is in tests/run.c and builds one .o)
        run: nix develop -c just wire-check

      - name: test (hosted unity build)
        run: nix develop -c just test

      - name: test at the moqt_chat room profile
        run: nix develop -c just test-room

      - name: test with 3 WT sessions per connection (no hard-coded 2)
        run: WT_SESSIONS=3 nix develop -c just test-fast

      - name: ccn (lizard, CCN <= 3)
        run: nix develop -c just ccn

      - name: halstead-check (Halstead, MI, exits, parameters)
        run: nix develop -c just halstead-check

      - name: py-check (ruff, unittests, CCN <= 3 for scripts/)
        run: nix develop -c just py-check

      - name: sh-check (shellcheck, justfile format)
        run: nix develop -c just sh-check

      - name: golden-check (moqt_golden.h matches the testvectors JSON)
        run: nix develop -c just golden-check

      - name: features-check (ledger test links, IDs and coverage counts)
        run: nix develop -c just features-check

      - name: lint (clang-tidy, CERT C + bug finders)
        run: nix develop -c just lint

      - name: fuzz smoke (each harness builds and survives 1 run)
        run: nix develop -c just fuzz-smoke

      # ~11 s; per push so a compiler change that turns a masked select back
      # into a secret-dependent branch or load fails here, not overnight.
      - name: ct-check (secret-taint constant-time check, valgrind)
        run: nix develop -c just ct-check

  # Sanitizer checks, CI only (too slow for the local dev loop): the unity
  # test under ASan + UBSan, and the freestanding production build with
  # UBSan/bounds traps driven by the guide snippets. A separate job, so it
  # runs in parallel with the gate instead of lengthening it.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: test-san (unity test under ASan + UBSan)
        run: nix develop -c just test-san

      - name: build the trap-sanitized SDK, examples and snippets
        run: nix develop -c just ninja san

      # Outside nix: the runner only needs go and node on PATH.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: guide/go.mod
          cache-dependency-path: guide/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: san-check (run the snippets against the sanitized build)
        working-directory: guide
        run: GUIDE_BIN="$PWD/../build/san/guide" node runner/run.ts

  # aarch64: the freestanding build, the unity test (AES-GCM through the
  # ARMv8 AES/PMULL instructions on this runner) and one HTTP/3 POST from
  # the guide's quic-go probe to the aarch64 word_list server.
  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: compile (freestanding)
        run: nix develop -c just ninja

      - name: test (hosted unity build)
        run: nix develop -c just test

      - name: build word_list
        run: nix develop -c just ninja examples/word_list/wired_server

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: guide/go.mod
          cache-dependency-path: guide/go.sum

      - name: HTTP/3 POST to the aarch64 server
        run: |
          (cd guide && go build -o ../build/probe ./probe)
          ./examples/word_list/wired_server --port 4433 &
          srv=$!
          sleep 1
          echo 'hello from aarch64' > body
          ./build/probe h3req localhost:4433 POST / --body-file body > out
          kill "$srv"
          grep -q '^status 200$' out

  # The moqt_chat frontend and its e2e scripts: biome, tsc, both unit
  # suites and their complexity limits (just js-check).
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: examples/moqt_chat/frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: examples/moqt_chat/frontend/pnpm-lock.yaml

      - name: install frontend and e2e dependencies
        run: |
          (cd examples/moqt_chat/frontend && pnpm install --frozen-lockfile)
          (cd examples/moqt_chat/e2e && npm ci)

      - name: js-check
        run: nix develop -c just js-check
