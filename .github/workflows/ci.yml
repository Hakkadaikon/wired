name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The flake (flake.nix + flake.lock) is the single source of truth for
      # the toolchain: CI runs the exact same clang/clang-tidy/clang-format/
      # lizard versions as `nix develop` locally, so a green gate here means
      # the same commands are green on a developer machine and vice versa.
      - uses: DeterminateSystems/nix-installer-action@main

      - name: fmt-check
        run: nix develop -c just fmt-check

      - name: compile (freestanding, proves libc independence)
        run: nix develop -c just ninja

      - name: test (hosted unity build)
        run: nix develop -c just test

      - name: ccn (lizard, CCN <= 3)
        run: nix develop -c just ccn

      - name: halstead-check (Halstead, MI, exits, parameters)
        run: nix develop -c just halstead-check

      - name: py-check (ruff, unittests, CCN <= 3 for scripts/)
        run: nix develop -c just py-check

      - name: sh-check (shellcheck, justfile format)
        run: nix develop -c just sh-check

      - name: golden-check (moqt_golden.h matches the testvectors JSON)
        run: nix develop -c just golden-check

      - name: lint (clang-tidy, CERT C + bug finders)
        run: nix develop -c just lint

      - name: fuzz smoke (each harness builds and survives 1 run)
        run: nix develop -c just fuzz-smoke

  # The moqt_chat frontend and its e2e scripts: biome, tsc, both unit
  # suites and their complexity limits (just js-check).
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: examples/moqt_chat/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: examples/moqt_chat/frontend/pnpm-lock.yaml

      - name: install frontend and e2e dependencies
        run: |
          (cd examples/moqt_chat/frontend && pnpm install --frozen-lockfile)
          (cd examples/moqt_chat/e2e && npm ci)

      - name: js-check
        run: nix develop -c just js-check
