name: Coverage

# Scheduled, not per-push/PR: `just cov` recompiles the whole unity build a
# second time (instrumented), so running it on every micro-commit would
# roughly double CI time for no benefit -- coverage doesn't meaningfully
# shift commit-to-commit. Daily is enough to catch a badge going stale.
# workflow_dispatch lets you trigger it on demand (e.g. right after a change
# you want reflected sooner).
on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: line coverage (LLVM source-based, hosted unity build)
        run: nix develop -c just cov

      - name: upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
