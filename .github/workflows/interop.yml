name: Interop

on:
  workflow_dispatch:

jobs:
  quic-interop-runner:
    runs-on: ubuntu-latest
    # 17 test cases; the loss/corruption cases retry under a 300s per-case
    # budget, so a full run is wall-clock heavy. 120min bounds a wedged
    # simulator without cutting a slow-but-healthy run short.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # ubuntu-latest ships Docker Engine 28.0.x; quic-network-simulator's
      # compose file uses the network `interface_name` option, which needs
      # 28.1+ (confirmed via a --debug run: "interface_name requires Docker
      # Engine v28.1 or later", not a wired-side compliance failure).
      - name: upgrade Docker Engine to 28.1+
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
          docker version

      - name: install tshark (runner needs Wireshark 4.5+ for trace analysis)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: build server binary
        run: nix develop -c sh -c 'just gen-ninja && ninja examples/word_list/wired_server'
        env:
          # The interop runner's multiconnect cases open 50 connections --
          # quinn opens all 50 in PARALLEL -- and under handshakeloss/
          # -corruption a lost peer CONNECTION_CLOSE leaves its slot busy
          # until the 30s idle sweep; 16 filled up and refused connections
          # mid-test (quinn handshakeloss, measured live), so the cap must
          # cover the full 50 plus lingering closed slots.
          CONNTABLE_CAP: "64"

      - name: build docker image
        run: docker build -t wired-interop -f interop/Dockerfile .

      - name: clone quic-interop-runner
        run: git clone --depth 1 https://github.com/quic-interop/quic-interop-runner.git runner

      - name: install runner requirements
        run: |
          python3 -m venv runner/.venv
          runner/.venv/bin/pip install --quiet -r runner/requirements.txt

      - name: register wired as server implementation
        run: |
          python3 - runner/implementations_quic.json <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path) as f:
              data = json.load(f)
          data["wired"] = {
              "image": "wired-interop",
              "url": "https://github.com/Hakkadaikon/wired",
              "role": "server",
          }
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: run the quic-go-green test cases
        working-directory: runner
        # --log-dir pins the output path: without it run.py timestamps its
        # own logs_<ISO8601>/ directory (confirmed via a real run: "Saving
        # logs to logs_2026-07-25T09:39:08."), which the fixed path below
        # would never match -- the artifact upload silently found nothing.
        #
        # run.py exits with the number of FAILED tests (UNSUPPORTED does not
        # count), so this list is every case that passes against the quic-go
        # client (tasks/quic-interop-matrix.md). Deliberately excluded:
        #   rebind-port / rebind-addr  -- the runner's tshark cannot decode
        #     short-header packets on the rebound path (toolchain constraint,
        #     not a server bug); permanently FAILED
        #   connectionmigration -- the quic-go client never migrates, the
        #     runner then fails the run ("saw only a single path")
        #   ecn / v2 -- the quic-go client exits 127 on them (UNSUPPORTED);
        #     harmless but wasted minutes until an ngtcp2/picoquic client job
        #   versionnegotiation -- not implemented server-side (run_endpoint.sh
        #     declares it unsupported)
        #   goodput / crosstraffic -- throughput measurements, not pass/fail;
        #     shared-runner perf variance would make CI flaky
        run: >
          ./.venv/bin/python run.py -s wired -c quic-go
          -t handshake,transfer,http3,longrtt,multiplexing,chacha20,keyupdate,blackhole,handshakeloss,transferloss,handshakecorruption,transfercorruption,amplificationlimit,retry,resumption,zerortt,ipv6
          --log-dir logs --json logs/result.json

      - name: upload runner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: runner/logs
          if-no-files-found: ignore
