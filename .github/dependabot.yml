version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /guide
      - /examples/moqt_chat/frontend
      - /examples/moqt_chat/e2e
    schedule:
      interval: weekly
    # minor and patch updates arrive as one PR; a major version gets its own,
    # so one breaking bump (an engine requirement, an API change) does not
    # hold the rest back
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
