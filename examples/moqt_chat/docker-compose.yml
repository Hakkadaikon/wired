# `docker compose up` alone builds this image from whatever wired_server
# binary is currently on disk in this dir -- it does NOT build the binary
# itself, since that needs the repo's pinned clang/ninja toolchain outside
# any container (see Dockerfile / justfile's `image` recipe). Run `just
# build` (or `just image`) first to pick up source changes:
#   just build && docker compose -f examples/moqt_chat/docker-compose.yml up
services:
  wired_server:
    image: moqt-chat
    build:
      context: ../..
      dockerfile: examples/moqt_chat/Dockerfile
    ports:
      - "4433:4433/udp"
