# Use `just up` / `just up-bg` / `just down` (justfile) rather than calling
# docker compose directly: this file's `build:` only packages whatever
# wired_server binary is already on disk into the scratch image, it does
# NOT build the binary itself (that needs the repo's pinned clang/ninja
# toolchain outside any container -- see Dockerfile), so a bare `docker
# compose up` silently skips picking up source changes unless `just build`
# ran first.
services:
  wired_server:
    image: moqt-chat
    build:
      context: ../..
      dockerfile: examples/moqt_chat/Dockerfile
    ports:
      - "4433:4433/udp"
